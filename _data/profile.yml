short_bio: >-
  <p>
    Hi there! I'm Jingyang (John) Gong, and welcome to my homepage. I’m currently an Research Assistant and an incoming PhD students in <a href="https://www.hku.hk">The University of Hong Kong</a>, supervised by <a href="https://reynold.hku.hk">Prof. Reynold Cheng</a> and <a href="https://www.ai.hku.hk/people/academic-staff/kao">Prof. Ben Kao</a>. Before that, I earned my M.S of Computer Engineering in  <a href="https://www.nyu.edu">New York University</a> and B.Eng of Data Science with distinction in <a href="https://english.ecnu.edu.cn">East China Normal University</a>.
  </p>
  <p>
    My primary research interests is coding capability of foundational LLMs. Apart from that, I'm also interested in mechanistic interpretability and multilingual LLM.
  </p>

